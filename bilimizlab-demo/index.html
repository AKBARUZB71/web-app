</style></head><body><main id="shell"><header class="top"><div class="brand"><div class="mark">◫</div><div><div class="brand-name">Bilimizlab<span style="color:var(--clay)">.</span></div><small>ONLINE KITOB DO‘KONI</small></div></div><div class="top-actions"><button class="iconbtn" onclick="switchTab('catalog')" aria-label="Qidiruv">⌕</button><button class="iconbtn" onclick="switchTab('cart')" aria-label="Savat">♧</button></div></header><section id="page" class="page"></section><nav id="bottom" class="bottom"></nav></main>
<script>
const data=[{id:1,t:'Atom odatlar',c:'ATOM\nODATLAR',a:'James Clear',pr:49000,cat:'Rivojlanish',co:'c1',desc:'Kichik odatlarni shakllantirish va hayotda izchil o‘zgarishlarni amalga oshirish haqida amaliy kitob.'},{id:2,t:'Anomaliya',c:'ANOMALIYA',a:'Husan Sodiqov',pr:44000,cat:'Badiiy',co:'c2',desc:'O‘zbek kitobxonlari orasida mashhur bo‘lgan zamonaviy badiiy asar. Namuna tavsif.'},{id:3,t:'Molxona',c:'MOLXONA',a:'Jorj Oruell',pr:39000,cat:'Badiiy',co:'c3',desc:'Jamiyat, hokimiyat va tenglik mavzularidagi mashhur ramziy qissa.'},{id:4,t:'1984',c:'1984',a:'Jorj Oruell',pr:45000,cat:'Badiiy',co:'c4',desc:'Nazorat, haqiqat va erkinlik haqida distopik roman.'},{id:5,t:'Baxtiyor hayot sirlari',c:'BAXTIYOR\nHAYOT',a:'Deyl Karnegi',pr:42000,cat:'Rivojlanish',co:'c5',desc:'O‘z ustida ishlash mavzusidagi kitob. Demo tavsif.'},{id:6,t:'O‘tkan kunlar',c:'O‘TKAN\nKUNLAR',a:'Abdulla Qodiriy',pr:57000,cat:'Badiiy',co:'c6',desc:'O‘zbek adabiyotining mashhur tarixiy romani.'},{id:7,t:'Ufq',c:'UFQ',a:'Said Ahmad',pr:59000,cat:'Badiiy',co:'c7',desc:'Insoniy munosabat va taqdir haqida trilogiya.'},{id:8,t:'Mehrobdan chayon',c:'MEHROBDAN\nCHAYON',a:'Abdulla Qodiriy',pr:46000,cat:'Badiiy',co:'c8',desc:'O‘zbek mumtoz adabiyotidagi muhim asarlardan biri.'}];
let tab='home',chosen=null,cart={},filter='Barchasi',search='',slide=0,completed=false,adminBanner='Kitoblar olamiga xush kelibsiz',demoOrders=0;let quotelist=['Bir sahifa bugunningizni, bir kitob kelajagingizni o‘zgartirishi mumkin.','Kitob bilan o‘tgan vaqt — o‘zingizga berilgan eng yaxshi sovg‘a.','Yangi fikrlar yangi sahifalardan boshlanadi.'];let quote=quotelist[Math.floor(Math.random()*quotelist.length)];const money=n=>Number(n).toLocaleString('ru-RU')+' so‘m';const b=id=>data.find(x=>x.id===id);const qty=id=>cart[id]||0;const count=()=>Object.values(cart).reduce((a,v)=>a+v,0);const total=()=>data.reduce((sum,x)=>sum+x.pr*qty(x.id),0);
function cover(x){return '<div class="cover '+x.co+'"><div class="topline">BILIMIZLAB COLLECTION</div><strong>'+x.c.replace(/\n/g,'<br>')+'</strong><div class="by">'+x.a+'</div></div>'}
function card(x){return '<div class="bookcard"><div onclick="detail('+x.id+')" style="cursor:pointer">'+cover(x)+'<div class="bookname">'+x.t+'</div><div class="author">'+x.a+'</div></div><div class="bookbottom"><div class="price">'+money(x.pr)+'</div><button class="add" onclick="add('+x.id+')" aria-label="Savatga qo‘shish">+</button></div></div>'}
function nav(){document.getElementById('bottom').innerHTML=[['home','⌂','Bosh sahifa'],['catalog','▦','Katalog'],['cart','♧','Savat'],['settings','⚙','Sozlamalar']].map(x=>'<button onclick="switchTab(\''+x[0]+'\')" class="navbtn '+(tab===x[0]?'sel':'')+'"><span class="sym">'+x[1]+'</span>'+x[2]+(x[0]==='cart'&&count()?'<i class="counter">'+count()+'</i>':'')+'</button>').join('')}
function switchTab(t){tab=t;chosen=null;completed=false;render();window.scrollTo(0,0)}
function add(id){cart[id]=(cart[id]||0)+1;nav();let e=document.getElementById('alert');if(e)e.textContent='✓ Savatga qo‘shildi';if(tab==='cart')render()}
function change(id,d){cart[id]=Math.max(0,qty(id)+d);if(!cart[id])delete cart[id];render()}
function detail(id){chosen=id;render();window.scrollTo(0,0)}
function home(){let labels=['YANGI SAHIFA, YANGI OLAM','BIZNING TANLOVIMIZ','MUTOLAA LAZZATI'];let titles=[adminBanner,'Hayotga boshqacha qarang','Har hikoya — bir kashfiyot'];return '<div class="eyebrow">Kitoblar bilan hayot yanada go‘zal</div><div style="height:12px"></div><div class="hero '+(slide===1?'night':slide===2?'story':'')+'"><div class="hero-body"><div class="eyebrow">'+labels[slide]+'</div><h1>'+titles[slide]+'</h1><p>Bilim, tafakkur va ilhom manbai — siz izlagan kitoblar bir joyda.</p><button onclick="switchTab(\'catalog\')">Katalogni ko‘rish ↗</button></div></div><div class="dots">'+[0,1,2].map(i=>'<button class="dot '+(slide===i?'active':'')+'" onclick="slide='+i+';render()" aria-label="Banner '+(i+1)+'"></button>').join('')+'</div><div class="quote"><div class="qicon">“</div><em>'+quote+'</em></div><div class="ribbon">MUHARRIR TANLOVI</div><div class="sectiontitle" style="margin-top:0"><h2>Top 5 kitoblar</h2><button class="textlink" onclick="switchTab(\'catalog\')">Barchasi ↗</button></div><div class="scrollrow">'+data.slice(0,5).map(card).join('')+'</div><div class="sectiontitle"><h2>Kitob tanlang</h2></div><div class="kinds">'+[['📚','Badiiy'],['🌿','Rivojlanish'],['🧠','Psixologiya'],['🎓','O‘quv kitoblari']].map(x=>'<button class="kind" onclick="filter=\''+x[1]+'\';switchTab(\'catalog\')"><span>'+x[0]+'</span>'+x[1]+'</button>').join('')+'</div><div class="sectiontitle"><h2>Yangi kashfiyotlar</h2></div><div class="scrollrow">'+data.slice(3,8).map(card).join('')+'</div><footer class="note">Demo katalog • Namuna narxlar • Real savdo emas</footer>'}
function catalog(){let filtered=data.filter(x=>(filter==='Barchasi'||x.cat===filter)&& (x.t+' '+x.a).toLowerCase().includes(search.toLowerCase()));return '<div class="ribbon">KASHF ETING</div><div class="sectiontitle" style="margin-top:5px"><h2>Kitoblar katalogi</h2><span class="tag">'+filtered.length+' ta kitob</span></div><div class="search">⌕ <input placeholder="Kitob yoki muallifni qidiring..." id="searchInput" value="'+search.replace(/"/g,'&quot;')+'" oninput="search=this.value;document.getElementById(\'products\').innerHTML=listBooks()" ></div><div class="filters">'+['Barchasi','Badiiy','Rivojlanish','Psixologiya','O‘quv kitoblari'].map(c=>'<button class="chip '+(filter===c?'active':'')+'" onclick="filter=\''+c+'\';render()">'+c+'</button>').join('')+'</div><div id="products">'+listBooks()+'</div>'}
function listBooks(){let filtered=data.filter(x=>(filter==='Barchasi'||x.cat===filter)&& (x.t+' '+x.a).toLowerCase().includes(search.toLowerCase()));return filtered.length?'<div class="grid">'+filtered.map(card).join('')+'</div>':'<div class="empty">Bu bo‘limda kitob topilmadi. Boshqa qidiruvni sinab ko‘ring.</div>'}
function product(){let x=b(chosen);return '<button class="back" onclick="chosen=null;render()">‹ Orqaga</button><div class="detailvisual">'+cover(x)+'</div><h1 class="detailtitle">'+x.t+'</h1><div class="metas">'+x.a+' · '+x.cat+' · Jismoniy kitob</div><div class="sectiontitle"><h2 style="font-size:21px">Kitob haqida</h2><span class="pill">● Mavjud</span></div><div class="detailcopy">'+x.desc+'</div><div class="notice">Kitob muqovalari, narxlar va zaxira — demo namunalari. Buyurtma do‘kon serveriga yuborilmaydi.</div><div class="stickybuy"><div class="price" style="font-size:17px">'+money(x.pr)+'</div><button class="mainbtn" onclick="add('+x.id+');switchTab(\'cart\')">Savatga qo‘shish ↗</button></div><div id="alert" style="color:var(--olive);font-size:12px"></div>'}
function cartpage(){if(!count())return '<div class="ribbon">XARID SAVATINGIZ</div><h2 class="detailtitle">Savat</h2><div class="empty" style="font-size:36px">♧<p style="font-size:14px">Savatingiz hozircha bo‘sh</p><button class="mainbtn" onclick="switchTab(\'catalog\')">Kitoblarni ko‘rish</button></div>';return '<div class="ribbon">XARID SAVATINGIZ</div><h2 class="detailtitle" style="margin:4px 0 20px">Savat <span style="font:13px DM Sans;color:var(--muted)">('+count()+' ta)</span></h2>'+data.filter(x=>qty(x.id)).map(x=>'<div class="rowitem">'+cover(x)+'<div class="details"><div style="font-weight:800;font-size:13px">'+x.t+'</div><div class="author">'+x.a+'</div><div class="price" style="margin-top:8px">'+money(x.pr*qty(x.id))+'</div><div class="qty"><button onclick="change('+x.id+',-1)">−</button>'+qty(x.id)+'<button onclick="change('+x.id+',1)">+</button></div></div></div>').join('')+'<div class="total"><span>Jami:</span><span>'+money(total())+'</span></div><button class="mainbtn blockbtn" onclick="tab=\'checkout\';render()">Rasmiylashtirish →</button><div class="notice">Buyurtma berish faqat namoyish uchun. Haqiqiy to‘lov olinmaydi.</div>'}
function checkout(){return '<button class="back" onclick="switchTab(\'cart\')">‹ Savatga qaytish</button><div class="ribbon">YAKUNIY BOSQICH</div><h2 class="detailtitle">Rasmiylashtirish</h2><div class="notice">Bu ochiq demo. Shaxsiy telefon raqamingiz yoki aniq manzilingizni kiritmang. Test ma’lumotlar yetarli.</div><form onsubmit="event.preventDefault();demoOrders++;cart={};completed=true;tab=\'success\';render()"><label class="field">Ism-familiya<input required placeholder="Test foydalanuvchi"></label><label class="field">Telefon<input required placeholder="+998 90 000 00 00" pattern="[+0-9\s()-]{9,20}"></label><label class="field">Yetkazish manzili<input required placeholder="Test manzil, Toshkent"></label><label class="field">Izoh<textarea placeholder="Ixtiyoriy izoh"></textarea></label><div class="total"><span>Jami:</span><span>'+money(total())+'</span></div><button class="mainbtn blockbtn">Demo buyurtma berish</button></form>'}
function success(){return '<div class="success"><div class="successicon">✓</div><div class="ribbon">DEMO BUYURTMA</div><h2 class="detailtitle">Buyurtmangiz namuna sifatida qabul qilindi!</h2><p class="detailcopy">Bu demo rejim. Buyurtma serverga yuborilmadi va kitob yetkazilmaydi. Haqiqiy do‘konda yetkazish muddati alohida tasdiqlanadi.</p><button class="mainbtn blockbtn" onclick="switchTab(\'home\')">Bosh sahifaga qaytish</button></div>'}
